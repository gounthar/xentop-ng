[package]
name = "xentop-ng"
version = "0.1.0"
edition = "2021"
description = "A modern, btop-inspired resource monitor for the Xen hypervisor"
license = "GPL-2.0-only"
rust-version = "1.80"

[dependencies]
anyhow = "1"
libloading = "0.9"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
