[package]
name = "xentop-ng"
version = "0.5.0"
edition = "2021"
description = "A modern, btop-inspired resource monitor for the Xen hypervisor"
license = "GPL-2.0-only"
repository = "https://github.com/olivierlambert/xentop-ng"
readme = "README.md"
keywords = ["xen", "hypervisor", "monitoring", "tui", "xcp-ng"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.88"

[dependencies]
anyhow = "1"
libc = "0.2"
libloading = "0.9"
unicode-width = "0.2"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
