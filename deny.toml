# cargo-deny: run `cargo deny check` (also in CI).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Fail on any known vulnerability; unmaintained/yanked crates are reviewed
# case by case.
yanked = "deny"

[licenses]
# Everything here is compatible with distributing a GPL-2.0-only binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-2.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
