name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python3 tests/libxenstat/check-reader.py
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke test (demo, batch mode)
        run: |
          ./target/release/xentop-ng --demo-cpus 128 --demo-mem 1T --batch -n 2 -d 0.2 | tail -1 | python3 -m json.tool > /dev/null
          ./target/release/xentop-ng --demo-stock --batch -n 1 -d 0.2 | python3 -c 'import json,sys; s=json.load(sys.stdin)["sources"]; assert s["pcpu"]=="missing", s'

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --locked --all-targets

  cross:
    name: check arm64, riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Type-check only: build/build-cross.sh links and tests them under
      # qemu at release time.
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c clippy -t aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu
      - run: cargo clippy --locked --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo clippy --locked --target riscv64gc-unknown-linux-gnu -- -D warnings

  deny:
    name: advisories & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck build/*.sh docs/tools/*.sh dist/*.sh tests/xentop/harness/*.sh
